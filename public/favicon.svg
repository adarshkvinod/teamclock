<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4d35" />
      <stop offset="100%" stop-color="#073b28" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Pill / Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#tcGrad)" />

  <!-- Outer Dial Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#10b981" stroke-width="3.5" opacity="0.35" />

  <!-- Active Dial Arc -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#10b981" stroke-width="3.5" stroke-dasharray="90 40" stroke-linecap="round" />

  <!-- Clock Hands -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="43" y2="32" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Center Pivot Dot -->
  <circle cx="32" cy="32" r="3" fill="#10b981" />
</svg>